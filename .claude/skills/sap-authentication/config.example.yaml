# SAP Authentication Skill Configuration
# Copy this file to ~/.sap-auth/config.yaml and edit values accordingly.

# SAP account email for automatic account selection on SSO page.
# If not set, the first available account tile will be selected.
SAP_AUTH_ACCOUNT: "xeric.wei@sap.com"

# AES-256-GCM encryption key for cookie/token file encryption.
# Must be at least 16 characters. Leave empty to store cookies in plain JSON.
# If set, all downstream app MCPs must use the same key as DECRYPT_KEY.
ENCRYPT_KEY: ""

# Browser display mode.
# Determines which Playwright MCP instance to use:
#   "headless" (default) → calls tools from "playwright-headless" MCP server
#   "headed"             → calls tools from "playwright-headed" MCP server
# Both MCP servers must be configured in your client. The user can override
# this at any time by asking to switch modes during the conversation.
BROWSER_MODE: "headless"
