# SAP CodeMeta API Catalog Configuration

# Directory to store cookie file (sap_cookies.txt).
# Default: ~/.sap-auth/codemeta
AUTH_COOKIE_DIR: ""

# AES-256-GCM decryption key for encrypted cookie files.
# Must match the ENCRYPT_KEY configured in sap-authentication.
# At least 16 characters. Leave empty if cookies are stored in plain text.
DECRYPT_KEY: ""
